<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الروابط التفاعلية</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --panel-bg: #ffffff;
            --accent-color: #0f766e;
            --border-color: #e5e7eb;
        }
        .dark-mode {
            --bg-color: #121212;
            --text-color: #f1f5f9;
            --panel-bg: #1e1e1e;
            --accent-color: #14b8a6;
            --border-color: #334155;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            transition: 0.3s;
        }
        .app-container {
            max-width: 450px;
            margin: auto;
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--accent-color);
        }
        .icon-btn {
            background: rgba(0,0,0,0.05);
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 8px;
        }
        .dark-mode .icon-btn { background: rgba(255,255,255,0.1); }

        .form-group {
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 13px;
            margin-top: 5px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .save-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }
        .links-list {
            max-height: 320px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .link-card {
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .dark-mode .link-card { background: rgba(255,255,255,0.02); }
        .link-title {
            font-weight: bold;
            font-size: 14px;
        }
        .link-url {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dark-mode .link-url { color: #aaa; }
        .link-actions {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .action-btn {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .btn-visit { background-color: #3b82f6; color: white; text-decoration: none; }
        .btn-copy { background-color: #10b981; color: white; }
        .btn-delete { background-color: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>🔗 مكتبة الروابط التفاعلية</h2>
        <button class="icon-btn" onclick="toggleDarkMode()">🌓 المظهر</button>
    </div>

    <!-- خانات الإضافة -->
    <div class="form-group">
        <input type="text" id="linkTitle" placeholder="عنوان الرابط (مثال: موقع مفيد)...">
        <input type="url" id="linkUrl" placeholder="ألصق الرابط هنا (https://)...">
        <button class="save-btn" onclick="saveLink()">حفظ الرابط في التطبيق</button>
    </div>

    <!-- قائمة الروابط التفاعلية -->
    <div class="links-list" id="linksList"></div>
</div>

<script>
    let links = JSON.parse(localStorage.getItem('myInteractiveLinks')) || [];

    window.onload = () => {
        if(localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
        renderLinks();
    };

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    function saveLink() {
        let title = document.getElementById('linkTitle').value.trim();
        let url = document.getElementById('linkUrl').value.trim();

        if(!title || !url) {
            alert('الرجاء إدخال العنوان والرابط معاً!');
            return;
        }

        if(!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }

        let newLink = { id: Date.now(), title, url };
        links.unshift(newLink);
        updateStorage();

        document.getElementById('linkTitle').value = '';
        document.getElementById('linkUrl').value = '';
        renderLinks();
    }

    function renderLinks() {
        let listContainer = document.getElementById('linksList');
        listContainer.innerHTML = '';

        if(links.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color:#888; font-size:12px; padding:20px;">لا توجد روابط محفوظة بعد</div>';
            return;
        }

        links.forEach(link => {
            let card = document.createElement('div');
            card.className = 'link-card';
            card.innerHTML = `
                <div class="link-title">${link.title}</div>
                <div class="link-url">${link.url}</div>
                <div class="link-actions">
                    <a class="action-btn btn-visit" href="${link.url}" target="_blank">🌐 فتح</a>
                    <button class="action-btn btn-copy" onclick="copyLink('${link.url}')">📋 نسخ</button>
                    <button class="action-btn btn-delete" onclick="deleteLink(${link.id})">🗑️ حذف</button>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    function copyLink(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert('تم نسخ الرابط إلى الحافظة بنجاح!');
        });
    }

    function deleteLink(id) {
        if(confirm('هل أنت متأكد من حذف هذا الرابط؟')) {
            links = links.filter(l => l.id !== id);
            updateStorage();
            renderLinks();
        }
    }

    function updateStorage() {
        localStorage.setItem('myInteractiveLinks', JSON.stringify(links));
    }
</script>

</body>
</html>
